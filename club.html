<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klub — OYU THİK</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Klub profili</small></div></a><nav class="navlinks"><a href="about.html">Haqqımızda</a><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><a class="btn btn-primary" href="login.html">Giriş et</a></div></header>
<main id="clubPage"><section class="section"><div class="container"><p>Yüklənir...</p></div></section></main>
<script src="app.js"></script><script>
const id=Number(new URLSearchParams(location.search).get('id'));
api('/public').then(d=>{const c=d.clubs.find(x=>Number(x.id)===id);if(!c){clubPage.innerHTML='<section class="section"><div class="container"><h2>Klub tapılmadı.</h2><a href="clubs.html">← Klublara qayıt</a></div></section>';return}
document.title=c.name+' — OYU THİK';const chair=c.chair_name||translateText('Sədr təyin edilməyib');const events=d.events.filter(e=>Number(e.club_id)===id).slice(0,6);
clubPage.innerHTML=`<section class="club-profile-hero"><div class="container"><a class="club-back" href="clubs.html">← Klublar</a><div class="club-profile-grid"><div class="club-profile-main"><div class="club-profile-logo">${c.logo_url?'<img src="'+esc(c.logo_url)+'" alt="'+esc(c.name)+'">':'✦'}</div><div><span class="club-kicker">OYU THİK • KLUB</span><h1>${esc(c.name)}</h1><p>${esc(c.description||'')}</p><div class="club-profile-stats"><span><b>${c.member_count||0}</b> ${translateText('üzv')}</span><span><b>${events.length}</b> Tədbir</span></div></div></div><div class="club-chair-card"><div class="club-chair-photo">${c.chair_photo?'<img src="'+esc(c.chair_photo)+'" alt="'+esc(chair)+'">':'<span>'+esc((chair||'?')[0])+'</span>'}</div><div class="club-chair-copy"><small>KLUB SƏDRİ</small><h2>${esc(chair)}</h2><p>${esc(c.chair_position||translateText('Klub sədri'))}</p></div></div></div></div></section><section class="section"><div class="container"><div class="section-title"><div><span class="eyebrow">FƏALİYYƏT</span><h2>Klubun tədbirləri</h2></div></div><div class="grid3">${events.length?events.map(e=>`<article class="card">${e.cover_url?'<div class="card-img"><img src="'+esc(e.cover_url)+'" alt="'+esc(e.title)+'" style="width:100%;height:100%;object-fit:cover"></div>':''}<div class="card-body"><span class="tag">${new Date(e.event_date).toLocaleDateString(getSiteLang()==='ru'?'ru-RU':getSiteLang()==='en'?'en-GB':'az-AZ')}</span><h3>${esc(e.title)}</h3><p>📍 ${esc(e.location||'OYU')}</p><p>${esc(e.description||'')}</p></div></article>`).join(''):'<p>Bu klub üçün hələ tədbir əlavə edilməyib.</p>'}</div></div></section>`;
}).catch(()=>clubPage.innerHTML='<section class="section"><div class="container"><h2>Məlumat yüklənmədi.</h2></div></section>');
</script></body></html>
