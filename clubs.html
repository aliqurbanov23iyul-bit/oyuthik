<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klublar — OYU THİK</title><link rel="stylesheet" href="styles.css"></head><body><header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Klublar</small></div></a><nav class="navlinks"><a href="about.html">Haqqımızda</a><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><a class="btn btn-primary" href="login.html">Giriş et</a></div></header><div class="page-head"><div class="container"><span class="eyebrow">İCMALAR</span><h1>Klublarımız</h1><p>Maraq dairənə uyğun klubu kəşf et.</p></div></div><section class="section"><div class="container grid3" id="grid"></div></section><script src="app.js"></script><script>
function clubCardPalette(img, card){
  if(!img || !card) return;
  const apply=()=>{try{
    const cv=document.createElement('canvas'),ctx=cv.getContext('2d');cv.width=cv.height=40;ctx.drawImage(img,0,0,40,40);
    const data=ctx.getImageData(0,0,40,40).data;let r=0,g=0,b=0,n=0;
    for(let i=0;i<data.length;i+=16){if(data[i+3]<100)continue;const mx=Math.max(data[i],data[i+1],data[i+2]),mn=Math.min(data[i],data[i+1],data[i+2]);if(mx>245&&mn>235)continue;r+=data[i];g+=data[i+1];b+=data[i+2];n++}
    if(!n)return;r=Math.round(r/n);g=Math.round(g/n);b=Math.round(b/n);
    card.style.setProperty('--club-rgb',r+','+g+','+b);
  }catch(e){}};
  img.complete?apply():img.addEventListener('load',apply,{once:true});
}
api('/public').then(d=>{grid.innerHTML=d.clubs.map(x=>`<article class="card club club-link-card" onclick="location.href=\'club.html?id=${x.id}\'" role="link" tabindex="0"><div class="club-top"><div class="club-icon">${x.logo_url ? '<img src="'+esc(x.logo_url)+'" alt="'+esc(x.name)+' logosu" class="club-logo-img">' : '✦'}</div><span class="club-member-badge"><b>${x.member_count||0}</b><small>${translateText('üzv')}</small></span></div><h3>${esc(x.name)}</h3><p>${esc(x.description||'')}</p><div class="leader"><div class="avatar">${x.chair_photo?'<img src="'+esc(x.chair_photo)+'" alt="'+esc(x.chair_name||'')+'">':esc((x.chair_name||'?')[0])}</div><div><b>${esc(x.chair_name||translateText('Sədr təyin edilməyib'))}</b><div class="meta">${translateText("Klub sədri")}</div></div></div></article>`).join('');grid.querySelectorAll('.club-link-card').forEach(card=>clubCardPalette(card.querySelector('.club-logo-img'),card))}).catch(()=>grid.innerHTML='<p>Klublar admin paneldən əlavə ediləcək.</p>')</script></body></html>
