<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klublar — OYU THİK</title><link rel="stylesheet" href="styles.css"></head><body><header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Klublar</small></div></a><nav class="navlinks"><a href="about.html">Haqqımızda</a><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><div class="public-member-nav"><a class="btn btn-primary" href="login.html">Giriş et</a></div></div></header><div class="page-head"><div class="container"><span class="eyebrow">İCMALAR</span><h1>Klublarımız</h1><p>Maraq dairənə uyğun klubu kəşf et.</p></div></div><section class="section"><div class="container grid3" id="grid"></div></section><script src="app.js"></script><script>api('/public').then(d=>grid.innerHTML=d.clubs.map(x=>`<a class="card club club-link-card" href="club.html?id=${x.id}"><div class="club-top"><div class="club-icon">${x.logo_url ? '<img src="'+esc(x.logo_url)+'" alt="'+esc(x.name)+' logosu" style="width:100%;height:100%;object-fit:contain">' : '✦'}</div><span class="tag">${x.member_count||0} ${translateText('üzv')}</span></div><h3>${esc(x.name)}</h3><p>${esc(x.description||'')}</p><div class="leader"><div class="avatar">${x.chair_photo?'<img src="'+esc(x.chair_photo)+'" alt="'+esc(x.chair_name||'')+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':esc((x.chair_name||'?')[0])}</div><div><b>${esc(x.chair_name||translateText('Sədr təyin edilməyib'))}</b><div class="meta">${translateText("Klub sədri")}</div></div></div></a>`).join('')).catch(()=>grid.innerHTML='<p>Klublar admin paneldən əlavə ediləcək.</p>')</script><nav class="mobile-bottom-nav" aria-label="Mobil əsas menyu"><a data-mobile-page="home" href="index.html"><span>⌂</span><b>Ana səhifə</b></a><a data-mobi
