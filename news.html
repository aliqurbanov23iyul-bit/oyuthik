<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xəbərlər — OYU THİK</title><link rel="stylesheet" href="styles.css"></head><body><header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Xəbərlər</small></div></a><nav class="navlinks"><a href="about.html">Haqqımızda</a><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><a class="btn btn-primary" href="login.html">Giriş et</a></div></header><div class="page-head"><div class="container"><h1>Xəbərlər və fəaliyyətlər</h1></div></div><section class="section"><div class="container grid3" id="grid"></div></section><script src="app.js"></script><script>api('/public').then(d=>grid.innerHTML=d.news.map(x=>`<article class="card"><div class="card-img">${x.cover_url ? '<img src="'+esc(x.cover_url)+'" alt="'+esc(x.title)+'" style="width:100%;height:100%;object-fit:cover">' : '📰'}</div><div class="card-body"><span class="tag">${esc(x.category||'Xəbər')}</span><h3>${esc(x.title)}</h3><p class="meta">${new Date(x.created_at).toLocaleDateString(getSiteLang()==='az'?'az-AZ':getSiteLang()==='ru'?'ru-RU':'en-GB')}</p><p>${esc(x.summary||'')}</p></div></article>`).join('')).catch(()=>grid.innerHTML='<p>Hələ xəbər əlavə edilməyib.</p>')</script></body></html>
