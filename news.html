<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xəbərlər — OYU THİK</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.news-page{background:#f4f8fd;min-height:100vh}
.news-hero{position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(4,27,62,.86) 0%,rgba(6,51,111,.67) 48%,rgba(13,86,170,.48) 100%),url('https://chatgpt.com/backend-api/estuary/content?id=file_00000000e63082468164d14046791146&ts=497254&p=fs&cid=1&sig=85d9d0ff081c583f978240d10afb23c8e3e1d5ce14a29f26f2d54f016a22632f&v=0') center 48%/cover no-repeat;color:#fff;padding:76px 0 68px}
.news-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,22,52,.24),transparent 62%);pointer-events:none}
.news-hero:after{content:"";display:none}
@keyframes newsFloat{50%{transform:translate(-25px,25px) rotate(8deg)}}
.news-hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:end}
.news-kicker{font-size:12px;font-weight:900;letter-spacing:3px;color:#75c4ff}
.news-hero h1{font-size:54px;line-height:1;margin:10px 0 16px}.news-hero p{max-width:650px;color:#d4e5fb;font-size:17px;line-height:1.7}
.news-hero-stat{justify-self:end;display:flex;gap:12px}.news-hero-stat div{min-width:105px;padding:16px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:18px}.news-hero-stat b{display:block;font-size:25px}.news-hero-stat span{font-size:11px;color:#d4e5fb}
.news-tools{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:34px 0 24px}.news-search{flex:1;max-width:430px;position:relative}.news-search i{position:absolute;left:16px;top:15px;color:#6f829c}.news-search input{width:100%;box-sizing:border-box;border:1px solid #dbe6f3;background:#fff;padding:13px 16px 13px 43px;border-radius:14px;outline:none;font:inherit;box-shadow:0 7px 22px rgba(20,55,100,.05)}
.news-filters{display:flex;gap:8px;flex-wrap:wrap}.news-filter{border:1px solid #d9e5f4;background:#fff;padding:10px 14px;border-radius:999px;font-weight:800;color:#52647d;cursor:pointer}.news-filter.active,.news-filter:hover{background:#0e55b5;color:#fff;border-color:#0e55b5}
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:70px}.news-card{background:#fff;border:1px solid #dce7f4;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px rgba(15,55,105,.07);transition:.3s;animation:newsIn .55s both}.news-card:hover{transform:translateY(-7px);box-shadow:0 22px 48px rgba(15,55,105,.14)}@keyframes newsIn{from{opacity:0;transform:translateY(16px)}}
.news-media{height:220px;position:relative;overflow:hidden;background:linear-gradient(135deg,#dceaff,#bcd8ff)}.news-media img{width:100%;height:100%;object-fit:cover;transition:.6s}.news-card:hover .news-media img{transform:scale(1.055)}.news-media-fallback{height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#0c3470,#1d70d7);color:#fff}.news-media-fallback img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))}
.news-category{position:absolute;left:15px;top:15px;background:rgba(255,255,255,.94);color:#0d4ca2;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;letter-spacing:.5px}.news-body{padding:20px}.news-date{font-size:11px;color:#7b8ca3;font-weight:700;display:flex;gap:6px;align-items:center}.news-body h2{font-size:20px;line-height:1.3;margin:10px 0;color:#071f46}.news-body p{font-size:13px;color:#667991;line-height:1.65;margin:0}.news-foot{border-top:1px solid #edf2f8;margin-top:17px;padding-top:14px;display:flex;justify-content:space-between;align-items:center}.news-more{color:#0d56b6;font-weight:900;font-size:12px}.news-empty{grid-column:1/-1;background:#fff;border:1px dashed #cddcec;border-radius:20px;padding:55px;text-align:center;color:#718096}
@media(max-width:900px){.news-hero-inner{grid-template-columns:1fr}.news-hero-stat{justify-self:start}.news-grid{grid-template-columns:1fr 1fr}.news-tools{align-items:stretch;flex-direction:column}.news-search{max-width:none}}
@media(max-width:620px){.news-hero{padding:55px 0}.news-hero h1{font-size:40px}.news-grid{grid-template-columns:1fr}.news-hero-stat{display:none}.news-media{height:205px}}
</style>
</head>
<body class="news-page">
<header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Xəbərlər</small></div></a><nav class="navlinks"><a href="about.html">Haqqımızda</a><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><div class="public-member-nav"><a class="btn btn-primary" href="login.html">Giriş et</a></div></div></header>
<section class="news-hero"><div class="container news-hero-inner"><div><div class="news-kicker">OYU THİK • SON YENİLİKLƏR</div><h1>Xəbərlər</h1><p>Universitet həyatından xəbərlər, tələbə klublarının fəaliyyəti, elanlar və THİK-in ən son yenilikləri bir yerdə.</p></div><div class="news-hero-stat"><div><b id="newsTotal">—</b><span>PAYLAŞIM</span></div><div><b>OYU</b><span>TƏLƏBƏ HƏYATI</span></div></div></div></section>
<main class="container"><div class="news-tools"><div class="news-search"><i class="fa-solid fa-magnifying-glass"></i><input id="newsSearch" placeholder="Xəbərlərdə axtar..."></div><div class="news-filters" id="filters"><button class="news-filter active" data-cat="">Hamısı</button></div></div><div class="news-grid" id="grid"></div></main>
<script src="app.js"></script>
<script>
let allNews=[];
function newsDate(v){return new Date(v).toLocaleDateString(getSiteLang()==='az'?'az-AZ':getSiteLang()==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'long',year:'numeric'})}
function renderNews(){const q=newsSearch.value.trim().toLowerCase(),active=document.querySelector('.news-filter.active')?.dataset.cat||'';const rows=allNews.filter(x=>(!active||(x.category||'Xəbər')===active)&&((x.title||'')+' '+(x.summary||'')).toLowerCase().includes(q));grid.innerHTML=rows.length?rows.map((x,i)=>`<article class="news-card" style="animation-delay:${Math.min(i*.06,.3)}s"><div class="news-media">${x.cover_url?'<img src="'+esc(x.cover_url)+'" alt="'+esc(x.title)+'">':'<div class="news-media-fallback"><img src="logo.png" alt="OYU THİK"></div>'}<span class="news-category">${esc(x.category||'Xəbər')}</span></div><div class="news-body"><div class="news-date"><i class="fa-regular fa-calendar"></i> ${newsDate(x.created_at)}</div><h2>${esc(x.title)}</h2><p>${esc(x.summary||'Ətraflı məlumat üçün paylaşımı izləyin.')}</p><div class="news-foot"><span class="news-more">OYU THİK</span><i class="fa-solid fa-arrow-right" style="color:#0d56b6"></i></div></div></article>`).join(''):'<div class="news-empty">Uyğun xəbər tapılmadı.</div>'}
api('/public').then(d=>{allNews=d.news||[];newsTotal.textContent=allNews.length;const cats=[...new Set(allNews.map(x=>x.category||'Xəbər'))];filters.innerHTML='<button class="news-filter active" data-cat="">Hamısı</button>'+cats.map(x=>'<button class="news-filter" data-cat="'+esc(x)+'">'+esc(x)+'</button>').join('');filters.onclick=e=>{const b=e.target.closest('.news-filter');if(!b)return;document.querySelectorAll('.news-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderNews()};newsSearch.oninput=renderNews;renderNews()}).catch(()=>grid.innerHTML='<div class="news-empty">Xəbərlər hazırda yüklənmir.</div>');
</script></body></html>
