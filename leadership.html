<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rəhbərlik — OYU THİK</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.leadership-page{background:#f5f8fc;min-height:100vh}
.leadership-hero{position:relative;overflow:hidden;padding:70px 0 66px;background:linear-gradient(120deg,#071b3b,#103f83 65%,#1d62c5);color:#fff}
.leadership-hero:after{content:"THİK";position:absolute;right:5%;bottom:-55px;font-size:190px;font-weight:900;color:rgba(255,255,255,.035);pointer-events:none}
.leadership-hero .container{position:relative;z-index:2}
.leadership-kicker{display:inline-flex;align-items:center;gap:8px;color:#78c4ff;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.leadership-hero h1{font-size:52px;line-height:1.05;margin:12px 0 14px}
.leadership-hero p{max-width:650px;margin:0;color:#d7e5f7;font-size:16px;line-height:1.65}
.leadership-content{padding:48px 0 75px}
.leadership-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}
.leadership-heading h2{margin:4px 0 0;font-size:30px;color:#0b2854}
.leadership-heading p{margin:0;color:#73839a;font-size:13px}
.leadership-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.leadership-group{margin-bottom:38px}.leadership-group-title{display:flex;align-items:center;gap:10px;margin:0 0 16px;color:#0b2854;font-size:22px}.leadership-group-title:after{content:"";height:1px;background:#dbe5f2;flex:1}.thik-chair-grid{grid-template-columns:minmax(0,520px)}.thik-chair-grid .leader-card{border-color:#bcd5f5;background:linear-gradient(145deg,#fff,#f4f8ff)}
.leader-card{position:relative;overflow:hidden;background:#fff;border:1px solid #dce6f3;border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(13,48,94,.06);transition:.2s}
.leader-card:hover{transform:translateY(-4px);box-shadow:0 17px 40px rgba(13,48,94,.11)}
.leader-top{display:flex;align-items:center;gap:15px;margin-bottom:18px}
.leader-photo{width:72px;height:72px;flex:0 0 72px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#e3efff,#c9ddfa);display:grid;place-items:center;color:#174fae;font-size:23px;font-weight:900;border:1px solid #d5e4f7}
.leader-photo img{width:100%;height:100%;object-fit:cover}
.leader-name{min-width:0}.leader-name h3{margin:0 0 7px;color:#0a2d60;font-size:19px;overflow-wrap:anywhere}
.leader-role{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eaf3ff;color:#1758ae;font-size:10px;font-weight:900;letter-spacing:.3px}
.leader-bio{border-top:1px solid #edf2f7;padding-top:15px;color:#667991;font-size:13px;line-height:1.6;margin:0;min-height:36px}
.leadership-empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd9e9;border-radius:20px;padding:50px 20px;text-align:center;color:#718096}
.leadership-empty i{font-size:34px;color:#8aa9d0;margin-bottom:12px}
@media(max-width:900px){.leadership-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){
 .leadership-hero{padding:38px 0 42px;border-radius:0 0 25px 25px}
 .leadership-hero h1{font-size:34px}
 .leadership-hero p{font-size:14px}
 .leadership-hero:after{font-size:110px;right:-10px;bottom:-25px}
 .leadership-content{padding:34px 0 55px}
 .leadership-heading{display:block;margin-bottom:18px}
 .leadership-heading h2{font-size:25px}
 .leadership-heading p{margin-top:7px}
 .leadership-grid{grid-template-columns:1fr;gap:13px}
 .leader-card{padding:17px;border-radius:18px}
 .leader-photo{width:62px;height:62px;flex-basis:62px;border-radius:17px}
 .leader-name h3{font-size:17px}
 .leader-card:hover{transform:none}
}
</style>
</head>
<body class="leadership-page">
<header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Rəhbərlik</small></div></a><nav class="navlinks"><a href="about.html">Haqqımızda</a><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><div class="public-member-nav"><a class="btn btn-primary" href="login.html">Giriş et</a></div></div></header>

<section class="leadership-hero"><div class="container"><div class="leadership-kicker"><i class="fa-solid fa-users-gear"></i> OYU THİK</div><h1>İdarəetmə şurası</h1><p>THİK-in fəaliyyətini koordinasiya edən idarəetmə heyəti və tələbə klublarının rəhbərləri ilə tanış olun.</p></div></section>

<main class="leadership-content"><div class="container">
<div class="leadership-heading"><div><div class="leadership-kicker" style="color:#3477ca">KOMANDA</div><h2>Rəhbərlik</h2></div><p>OYU THİK idarəetmə heyəti və klub sədrləri</p></div>
<div id="grid"><div class="leadership-empty">Məlumatlar yüklənir...</div></div>
</div></main>

<script src="app.js"></script>
<script>
api('/public').then(d=>{
 const users=d.managementUsers||[];
 const legacy=d.leadership||[];
 const thikChairs=users.filter(x=>!x.club_id && ['sədr','sedr','thik sədri','thik sedri'].includes((x.position_in_club||'').toLowerCase()));
 const clubChairs=users.filter(x=>x.role==='CHAIR' && x.club_id);
 const deputies=users.filter(x=>x.role==='VICE_CHAIR');
 const card=(x,label)=>`<article class="leader-card"><div class="leader-top"><div class="leader-photo">${x.photo_url?'<img src="'+esc(x.photo_url)+'" alt="'+esc(x.full_name)+'">':esc((x.full_name||'?')[0])}</div><div class="leader-name"><h3>${esc(x.full_name||'')}</h3><span class="leader-role">${esc(label)}</span></div></div><p class="leader-bio">${esc(x.club_name||x.bio||'OYU THİK')}</p></article>`;
 const group=(title,rows,label,extra='')=>rows.length?`<section class="leadership-group"><h3 class="leadership-group-title">${title}</h3><div class="leadership-grid ${extra}">${rows.map(x=>card(x,typeof label==='function'?label(x):label)).join('')}</div></section>`:'';
 let html='';
 html+=group('THİK Sədri',thikChairs,'Sədr (THİK)','thik-chair-grid');
 html+=group('Klub Sədrləri',clubChairs,x=>'Klub Sədri • '+(x.club_name||'OYU THİK'));
 html+=group('Sədr Müavinləri',deputies,x=>(x.club_name?x.club_name+' • ':'')+'Sədr Müavini');
 if(!html && legacy.length) html=group('Rəhbərlik',legacy,x=>x.title||'Rəhbərlik');
 grid.innerHTML=html||'<div class="leadership-empty"><i class="fa-solid fa-user-group"></i><div>Rəhbərlik məlumatları əlavə edildikdə burada görünəcək.</div></div>';
}).catch(()=>grid.innerHTML='<div class="leadership-empty">Rəhbərlik məlumatları hazırda yüklənmir.</div>');
</script>
</body></html>
