<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tədbir — OYU THİK</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body>
<header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Tədbir məlumatı</small></div></a><nav class="navlinks"><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><a class="btn btn-primary" href="login.html">Giriş et</a></div></header>
<main id="eventDetail"><section class="section"><div class="container">Yüklənir...</div></section></main><script src="app.js"></script><script>
const id=Number(new URLSearchParams(location.search).get('id'));
function parts(v){const d=new Date(v),m=['yanvar','fevral','mart','aprel','may','iyun','iyul','avqust','sentyabr','oktyabr','noyabr','dekabr'];return {date:d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(),time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}}
async function join(id,b){b.disabled=true;try{const r=await fetch('/api/event-attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:id})});const j=await r.json();if(r.status===401){location.href='login.html?next='+encodeURIComponent('event.html?id='+id);return}if(!r.ok)throw Error(j.error);b.innerHTML='<i class="fa-solid fa-check-double"></i> Qatıldım';b.classList.add('joined')}catch(e){alert(e.message);b.disabled=false}}
api('/public').then(d=>{const e=(d.events||[]).find(x=>Number(x.id)===id);if(!e){eventDetail.innerHTML='<section class="section"><div class="container"><h2>Tədbir tapılmadı.</h2></div></section>';return}document.title=e.title+' — OYU THİK';const dt=parts(e.event_date),past=new Date(e.event_date)<new Date();eventDetail.innerHTML=`<section class="event-detail-hero"><div class="container"><a href="events.html" class="club-back">← Tədbirlər</a><div class="event-detail-grid"><div class="event-detail-cover">${e.cover_url?'<img src="'+esc(e.cover_url)+'">':'<div class="event-cover-fallback"><i class="fa-regular fa-calendar"></i><span>OYU THİK</span></div>'}</div><div class="event-detail-copy"><span class="events-eyebrow">${esc(e.club_name||'OYU THİK')}</span><h1>${esc(e.title)}</h1><div class="event-detail-meta"><span><i class="fa-regular fa-calendar"></i> ${dt.date}</span><span><i class="fa-regular fa-clock"></i> ${dt.time}</span><span><i class="fa-solid fa-location-dot"></i> ${esc(e.location||'OYU')}</span><span><i class="fa-solid fa-users"></i> ${e.attendee_count||0} tələbə qatılır</span></div>${past?'<button class="event-join-btn disabled" disabled>Keçirilib</button>':'<button class="event-join-btn event-detail-join" onclick="join('+e.id+',this)"><i class="fa-solid fa-check"></i> Tədbirə qatıl</button>'}</div></div></div></section><section class="section"><div class="container event-about"><span class="eyebrow">TƏDBİR HAQQINDA</span><h2>Ətraflı məlumat</h2><p>${esc(e.description||'Bu tədbir üçün əlavə açıqlama daxil edilməyib.')}</p><div class="event-owner-box"><i class="fa-solid fa-building-columns"></i><div><small>TƏŞKİLATÇI</small><b>${esc(e.club_name||'OYU THİK')}</b></div></div></div></section>`}).catch(()=>eventDetail.innerHTML='<section class="section"><div class="container"><h2>Məlumat yüklənmədi.</h2></div></section>');
</script></body></html>
