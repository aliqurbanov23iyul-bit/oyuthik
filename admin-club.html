<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klub idarəsi — OYU THİK</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
body{background:#f4f7fb}.club-manage-shell{max-width:1150px;margin:34px auto;padding:0 20px}.cm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.cm-back{color:#315b91;text-decoration:none;font-weight:800}.cm-card{background:#fff;border:1px solid #dce5f1;border-radius:22px;padding:22px;box-shadow:0 10px 35px rgba(13,43,83,.06);margin-bottom:18px}.cm-title{margin:0;color:#10284d}.cm-sub{color:#718096;margin:5px 0 0}.leader-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.leader-card{border:1px solid #dce6f3;border-radius:18px;padding:17px;background:#f8fbff}.leader-card small{font-weight:900;color:#2862b2;letter-spacing:.7px}.leader-person{display:flex;align-items:center;gap:12px;margin-top:12px}.avatar{width:50px;height:50px;border-radius:15px;background:#e7f0ff;display:grid;place-items:center;color:#1551a7;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.leader-person b,.member-main b{display:block}.leader-person span,.member-main small{color:#718096;font-size:12px}.assign{margin-top:14px;display:flex;gap:8px}.assign input,.search{width:100%;box-sizing:border-box;border:1px solid #cfdbea;border-radius:12px;padding:11px 13px;font:inherit}.results{position:relative}.search-results{position:absolute;left:0;right:0;top:5px;background:#fff;border:1px solid #dce5f1;border-radius:13px;box-shadow:0 12px 35px rgba(0,0,0,.13);z-index:20;max-height:260px;overflow:auto}.search-item{padding:11px 13px;cursor:pointer;border-bottom:1px solid #edf1f6}.search-item:hover{background:#f1f6ff}.members-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.members-head .search{max-width:360px}.member-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #edf1f6}.member-no{width:28px;color:#8b99ab;font-weight:800}.member-main{flex:1}.role-pill{padding:6px 9px;border-radius:999px;background:#edf4ff;color:#215ba9;font-size:10px;font-weight:900}.dots-wrap{position:relative}.dots{width:38px;height:38px;border:0;border-radius:10px;background:#f0f4f9;cursor:pointer;font-size:18px}.menu{display:none;position:absolute;right:0;top:42px;width:180px;background:#fff;border:1px solid #dce5f1;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.13);z-index:10;padding:6px}.menu.open{display:block}.menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:8px;cursor:pointer;font-weight:700}.menu button:hover{background:#eef5ff}@media(max-width:700px){.leader-grid{grid-template-columns:1fr}.members-head{align-items:stretch;flex-direction:column}.members-head .search{max-width:none}.role-pill{display:none}}
</style></head><body><main class="club-manage-shell"><div class="cm-top"><a class="cm-back" href="admin.html">← İdarə paneli</a><span id="clubCount"></span></div><section class="cm-card"><h1 class="cm-title" id="clubName">Klub yüklənir...</h1><p class="cm-sub">Rəhbərlik və üzvləri bir yerdən idarə edin.</p><div class="leader-grid" id="leaders"></div></section><section class="cm-card"><div class="members-head"><div><h2 class="cm-title">Klub üzvləri</h2><p class="cm-sub">Üzvlər rəhbərlik sırasına görə göstərilir.</p></div><input class="search" id="memberFilter" placeholder="Üzv axtar..."></div><div id="members"></div></section></main><script src="app.js"></script><script>
const clubId=Number(new URLSearchParams(location.search).get('id'));let roster=[],allUsers=[];
async function req(url,opt){return api(url,opt)}
function avatar(x){return '<div class="avatar">'+(x&&x.photo_url?'<img src="'+esc(x.photo_url)+'">':esc(x&&x.full_name?x.full_name[0]:'?'))+'</div>'}
function leaderCard(role,label){const x=roster.find(m=>m.role===role);return '<div class="leader-card"><small>'+label+'</small><div class="leader-person">'+avatar(x)+'<div>'+(x?'<b>'+esc(x.full_name)+'</b><span>'+esc(x.group_no||'Qrup yoxdur')+'</span>':'<b>Təyin edilməyib</b><span>Axtarışdan üzv seçin</span>')+'</div></div><div class="assign"><div class="results" style="flex:1"><input class="search leader-search" data-role="'+role+'" placeholder="Ad Soyad yazın..."><div class="search-results" data-results="'+role+'" style="display:none"></div></div></div></div>'}
function render(){clubCount.textContent=roster.length+' üzv';leaders.innerHTML=leaderCard('CHAIR','KLUB SƏDRİ')+leaderCard('VICE_CHAIR','SƏDR MÜAVİNİ');filterMembers();bindSearch()}
function filterMembers(){const q=(memberFilter.value||'').toLowerCase();const list=roster.filter(x=>(x.full_name+' '+(x.member_code||'')+' '+(x.group_no||'')).toLowerCase().includes(q));members.innerHTML=list.length?list.map((x,i)=>'<div class="member-row"><span class="member-no">'+(i+1)+'</span>'+avatar(x)+'<div class="member-main"><b>'+esc(x.full_name)+'</b><small>'+esc(x.member_code||'')+' • '+esc(x.group_no||'Qrup yoxdur')+(x.faculty?' • '+esc(x.faculty):'')+'</small></div><span class="role-pill">'+roleLabel(x.role)+'</span><div class="dots-wrap"><button class="dots" onclick="toggleMenu(event,this)">⋮</button><div class="menu"><button onclick="setRole('+x.id+',\'CHAIR\')">Sədr et</button><button onclick="setRole('+x.id+',\'VICE_CHAIR\')">Sədr müavini et</button><button onclick="setRole('+x.id+',\'MEMBER\')">Üzv et</button><button onclick="location.href=\'admin.html?editMember='+x.id+'\'">Üzvü redaktə et</button></div></div></div>').join(''):'<p class="cm-sub" style="padding:25px 0">Üzv tapılmadı.</p>'}
function toggleMenu(e,b){e.stopPropagation();document.querySelectorAll('.menu.open').forEach(m=>m!==b.nextElementSibling&&m.classList.remove('open'));b.nextElementSibling.classList.toggle('open')}
document.addEventListener('click',()=>document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')));
async function setRole(uid,role){if(!confirm(role==='CHAIR'?'Bu üzv klub sədri təyin edilsin? Mövcud sədr avtomatik üzv olacaq.':role==='VICE_CHAIR'?'Bu üzv sədr müavini təyin edilsin? Mövcud müavin avtomatik üzv olacaq.':'Bu şəxsin rəhbərlik rolu ləğv edilib üzv edilsin?'))return;try{await req('/admin/clubs',{method:'PATCH',body:JSON.stringify({id:clubId,leadershipAction:role,memberId:uid})});await load()}catch(e){alert(e.message)}}
function bindSearch(){document.querySelectorAll('.leader-search').forEach(inp=>inp.oninput=()=>{const role=inp.dataset.role,box=document.querySelector('[data-results="'+role+'"]'),q=inp.value.trim().toLowerCase();if(q.length<1){box.style.display='none';return}const list=allUsers.filter(x=>x.active&&x.role!=='SUPER_ADMIN'&&(x.full_name+' '+(x.member_code||'')).toLowerCase().includes(q)).slice(0,8);box.innerHTML=list.map(x=>'<div class="search-item" onclick="setRole('+x.id+',\''+role+'\')"><b>'+esc(x.full_name)+'</b><br><small>'+esc(x.club_name||'Klubsuz')+' • '+esc(x.group_no||'Qrup yoxdur')+'</small></div>').join('')||'<div class="search-item">Tapılmadı</div>';box.style.display='block'})}
async function load(){try{const [d,u]=await Promise.all([req('/admin/clubs?details=1&id='+clubId),req('/admin/members')]);clubName.textContent=d.club.name;document.title=d.club.name+' — Klub idarəsi';roster=d.members||[];allUsers=u.members||[];render()}catch(e){document.body.innerHTML='<main class="club-manage-shell"><section class="cm-card"><h2>'+esc(e.message||'Klub məlumatları yüklənmədi')+'</h2><a href="admin.html">Geri qayıt</a></section></main>'}}
memberFilter.oninput=filterMembers;load();
</script></body></html>
