<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tədbirlər — OYU THİK</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body>
<header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Tədbirlər</small></div></a><nav class="navlinks"><a href="about.html">Haqqımızda</a><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><div class="public-member-nav"><a class="btn btn-primary" href="login.html">Giriş et</a></div></div></header>
<section class="events-hero"><div class="container"><span class="events-eyebrow">OYU THİK • TƏLƏBƏ HƏYATI</span><h1>Tədbirlər</h1><p>Universitet həyatını daha aktiv yaşa. Qarşıdan gələn tədbirləri kəşf et və bir kliklə iştirakını təsdiqlə.</p><div class="events-hero-pills"><span><i class="fa-regular fa-calendar"></i> Qarşıdan gələnlər</span><span><i class="fa-solid fa-users"></i> Tələbə icması</span></div></div></section>
<section class="section events-section"><div class="container"><div class="events-toolbar"><div><span class="eyebrow">TƏDBİRLƏR</span><h2>İştirak et, birlikdə olaq</h2></div><div class="event-filter"><button class="active" data-filter="all">Hamısı</button><button data-filter="upcoming">Qarşıdan gələn</button><button data-filter="past">Keçirilmiş</button></div></div><div class="events-grid" id="grid"></div></div></section>
<script src="app.js"></script><script>
let eventsData=[];let memberUser=null;let joinedEventIds=new Set();
function eventDateParts(v){const d=new Date(v),lang=getSiteLang();const azMonths=['yanvar','fevral','mart','aprel','may','iyun','iyul','avqust','sentyabr','oktyabr','noyabr','dekabr'];const azShort=['YAN','FEV','MAR','APR','MAY','İYN','İYL','AVQ','SEN','OKT','NOY','DEK'];const date=lang==='az'?(d.getDate()+' '+azMonths[d.getMonth()]+' '+d.getFullYear()):d.toLocaleDateString(lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'long',year:'numeric'});return {day:String(d.getDate()).padStart(2,'0'),month:lang==='az'?azShort[d.getMonth()]:d.toLocaleDateString(lang==='ru'?'ru-RU':'en-GB',{month:'short'}).replace('.','').toUpperCase(),date,time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}}
function renderEvents(filter='all'){const now=new Date();let list=eventsData.filter(e=>filter==='all'||(filter==='upcoming'?new Date(e.event_date)>=now:new Date(e.event_date)<now));grid.innerHTML=list.length?list.map(x=>{const dt=eventDateParts(x.event_date),past=new Date(x.event_date)<now;return `<article class="event-premium-card ${past?'event-past':''}" onclick="if(!event.target.closest('button')) location.href='event.html?id=${x.id}'" role="link"><div class="event-cover">${x.cover_url?'<img src="'+esc(x.cover_url)+'" alt="'+esc(x.title)+'">':'<div class="event-cover-fallback"><i class="fa-regular fa-calendar-star"></i><span>OYU THİK</span></div>'}<div class="event-date-tile"><b>${dt.day}</b><span>${dt.month}</span></div><span class="event-state">${past?'Keçirilib':'Qarşıdan gəlir'}</span></div><div class="event-content"><div class="event-club"><i class="fa-solid fa-circle-nodes"></i> ${esc(x.club_name||'OYU THİK')}</div><h3>${esc(x.title)}</h3><p class="event-desc">${esc(x.description||'Tədbir haqqında ətraflı məlumat üçün iştirakını təsdiqlə.')}</p><div class="event-info"><span><i class="fa-regular fa-clock"></i><b>${dt.time}</b> • ${dt.date}</span><span><i class="fa-solid fa-location-dot"></i>${esc(x.location||'OYU')}</span></div><div class="event-footer"><div class="attendee-count"><span class="attendee-icon"><i class="fa-solid fa-user-group"></i></span><div><b>${x.attendee_count||0}</b><small> tələbə qatılır</small></div></div>${past?'<button class="event-join-btn disabled" disabled>Keçirilib</button>':(!memberUser?'<a class="event-join-btn" href="login.html?next=events.html" onclick="event.stopPropagation()"><i class="fa-solid fa-right-to-bracket"></i> Giriş et və qatıl</a>':joinedEventIds.has(Number(x.id))?'<button class="event-join-btn joined" disabled><i class="fa-solid fa-check-double"></i> Qatıldım</button>':'<button class="event-join-btn" onclick="joinEvent('+x.id+',this)"><i class="fa-solid fa-check"></i> Qatıl</button>')}</div></div></article>`}).join(''):'<div class="events-empty"><i class="fa-regular fa-calendar-xmark"></i><h3>Tədbir tapılmadı</h3><p>Bu bölmədə hələ tədbir yoxdur.</p></div>'}
async function joinEvent(id,btn){btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Gözləyin';try{const r=await fetch('/api/event-attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:id})});const d=await r.json();if(r.status===401){location.href='login.html?next='+encodeURIComponent('events.html');return}if(r.status===409&&d.joined){joinedEventIds.add(Number(id));renderEvents(document.querySelector('.event-filter .active').dataset.filter);return}if(!r.ok)throw new Error(d.error||'Xəta');joinedEventIds.add(Number(id));btn.classList.add('joined');btn.innerHTML='<i class="fa-solid fa-check-double"></i> Qatıldım';const e=eventsData.find(x=>x.id===id);if(e)e.attendee_count=(e.attendee_count||0)+1;renderEvents(document.querySelector('.event-filter .active').dataset.filter)}catch(e){alert(e.message);btn.disabled=false;btn.innerHTML=old}}
document.querySelectorAll('.event-filter button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.event-filter button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderEvents(b.dataset.filter)});
Promise.all([api('/public'),fetch('/api/auth?action=me').then(r=>r.ok?r.json():null).catch(()=>null)]).then(async([d,me])=>{eventsData=d.events||[];memberUser=me&&me.user?me.user:null;if(memberUser){const states=await Promise.all(eventsData.map(e=>fetch('/api/event-attendance?eventId='+e.id).then(r=>r.ok?r.json():null).catch(()=>null)));states.forEach((s,i)=>{if(s&&s.joined)joinedEventIds.add(Number(eventsData[i].id))})}renderEvents()}).catch(()=>grid.innerHTML='<div class="events-empty"><h3>Tədbirlər yüklənmədi.</h3></div>');
</script></body></html>
