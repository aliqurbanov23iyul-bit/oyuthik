<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tədbirlər — OYU THİK</title><link rel="stylesheet" href="styles.css"></head><body><header class="navbar"><div class="container nav"><a class="brand" href="index.html"><img src="logo.png"><div><b>OYU THİK</b><small>Tədbirlər</small></div></a><nav class="navlinks"><a href="about.html">Haqqımızda</a><a href="clubs.html">Klublar</a><a href="news.html">Xəbərlər</a><a href="events.html">Tədbirlər</a><a href="leadership.html">Rəhbərlik</a></nav><a class="btn btn-primary" href="login.html">Giriş et</a></div></header><div class="page-head"><div class="container"><h1>Tədbirlər</h1><p>Qarşıdan gələn və keçirilmiş tədbirlər.</p></div></div><section class="section"><div class="container grid3" id="grid"></div></section><script src="app.js"></script><script>api('/public').then(d=>grid.innerHTML=d.events.map(x=>`<article class="card"><div class="card-body"><span class="tag">${new Date(x.event_date).toLocaleDateString('az-AZ')}</span><h3>${esc(x.title)}</h3><p>📍 ${esc(x.location||'OYU')}</p><p class="meta">${esc(x.club_name||'OYU THİK')}</p><p>${esc(x.description||'')}</p></div></article>`).join('')).catch(()=>grid.innerHTML='<p>Hələ tədbir əlavə edilməyib.</p>')</script></body></html>
